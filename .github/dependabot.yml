# Security fixes only: no pull requests for routine version bumps.
# `open-pull-requests-limit: 0` turns version updates off; security updates aren't affected by it.
# They are raised when an advisory affects a dependency (GitHub doesn't schedule them), and the
# groups below put every fix of an ecosystem into a single pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
  # the self-hosted image's base (Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ['*']
